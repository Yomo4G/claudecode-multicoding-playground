kind: agent
name: refactorer
version: 1
role: refactorer
description: |
  Simplifies and improves code structure on demand.
  Must verify behavioral equivalence after changes.
responsibilities:
  - Refactor code for improved readability and maintainability
  - Simplify complex implementations
  - Remove duplication
  - Verify behavioral equivalence after changes
  - Report changes via result files
authority:
  writable_paths:
    - "src/**"
    - "frontend/**"
    - "backend/**"
    - "tests/**"
    - "test/**"
  permitted_commands:
    - "pnpm test"
    - "pnpm lint"
    - "pnpm build"
constraints:
  - Must verify behavioral equivalence after refactoring
  - Must not modify governance files
  - Must not modify dashboard.md
  - Must not change external interfaces
  - Activated only on explicit request
activation:
  mode: on-demand
  prerequisites:
    - "Orchestrator has spawned this agent"
    - "Explicit refactoring request from orchestrator"
  trigger:
    - "Human requests refactoring"
    - "Reviewer recommends structural improvement"
scaling:
  min: 0
  max: 1
  condition: |
    On-demand only. Not spawned by default.
    Activated when refactoring is explicitly requested.
skill_detection: true
subagent_type: general-purpose
context_requirements:
  - "project.config.json"
  - "Source files to refactor"
  - "Test suite for equivalence verification"
handoff: []
tags:
  - refactoring
  - simplification

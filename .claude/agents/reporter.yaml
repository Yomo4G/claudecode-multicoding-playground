kind: agent
name: reporter
version: 1
role: reporter
description: |
  Updates dashboard.md with current execution state.
  Trigger-based activation. Sole writer of dashboard.md.
responsibilities:
  - Update Agent Status table in dashboard.md
  - Update Tasks Overview section
  - Update Overall Progress indicator
  - Update Skill Candidates section
  - Update Notes section when relevant
  - Update Review Summary section from review records
  - Read agent results and status from state files
  - Read review records from .claude/state/review-records/
authority:
  writable_paths:
    - "dashboard.md"
    - ".claude/state/agent-status/**"
    - ".claude/state/agent-results/**"
  permitted_commands: []
constraints:
  - Sole writer of dashboard.md
  - Must not modify product code
  - Must not modify governance files
  - Must follow AI UPDATE CONTRACT in dashboard.md
activation:
  mode: trigger-based
  prerequisites:
    - "Orchestrator has spawned this agent"
  trigger:
    - task-completed
    - task-started
    - agent-error
    - phase-transition
    - scaling-event
    - review-completed
    - session-resume
    - "periodic: every 3 tasks"
scaling:
  min: 1
  max: 1
  condition: |
    Non-scalable. Always exactly one instance.
subagent_type: general-purpose
context_requirements:
  - ".claude/state/agent-status/**"
  - ".claude/state/agent-results/**"
  - ".claude/state/review-records/**"
  - "dashboard.md"
handoff: []
tags:
  - reporting
  - dashboard
  - visibility
